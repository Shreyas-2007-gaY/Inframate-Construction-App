<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Inframate — Real-Time Construction Project Management Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inframate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inframate — Construction Project Management</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #14213D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #white;
      text-align: center;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(255, 119, 0, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 1.5px;
      margin: 0;
    }
    .app-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #FF7700;
      letter-spacing: 2px;
      margin-top: 4px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 119, 0, 0.2);
      border-top: 4px solid #FF7700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      font-size: 11px;
      color: #A0AEC0;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="Inframate Logo" class="logo-img" onerror="this.style.display='none'">
    <h1 class="app-title">INFRAMATE</h1>
    <div class="app-subtitle">Construction Management Platform</div>
    <div class="spinner"></div>
    <div class="loading-text">Loading Project Dashboard...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
